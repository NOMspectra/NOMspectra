# Publish to PyPI when a version tag (e.g. v1.0.2) is pushed.
# Uses PyPI trusted publishing: no API token is stored in the repository.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Check that tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION=$(python -c "v={}; exec(open('nomspectra/__version__.py').read(), v); print(v['__version__'])")
        if [ "$TAG" != "$VERSION" ]; then
          echo "Tag v$TAG does not match nomspectra/__version__.py ($VERSION)"
          exit 1
        fi
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
